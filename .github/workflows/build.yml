name: Build

# Compila la app y publica los binarios como artefactos.
#
# ── Por qué los tres trabajos son INDEPENDIENTES ────────────────────────────
#
# Antes había una cadena: `verificar` → (`android`, `ios`). Parecía lo correcto
# —no gastar un runner de macOS si el análisis falla— pero en la práctica costó
# dos APK seguidos:
#
#   · 2026-08-06 15:14 — un fallo de infraestructura de GitHub impidió al runner
#     descargar NINGUNA acción; `verificar` murió en «Set up job» y, al depender
#     de él, ni Android ni iOS se intentaron.
#   · 2026-08-06 16:00 — el mismo fallo, esta vez sólo en el runner de Android:
#     7 minutos colgado en «Set up job» mientras los otros dos trabajos pasaban
#     sin problema en la MISMA ejecución.
#
# La lección: cada «Set up job» es una tirada de dados contra la red de GitHub.
# Encadenar trabajos multiplica las tiradas y hace que el tropiezo de uno se
# lleve por delante a los demás. Ahora cada trabajo se verifica a sí mismo y
# publica lo suyo; que iOS falle no puede dejarte sin APK.
#
# El análisis de Flutter vive DENTRO del trabajo de Android en vez de en uno
# aparte: reutiliza el mismo checkout y el mismo SDK, así que sale gratis y evita
# una preparación de runner entera.
#
# ── Si los trabajos salen «cancelled» SIN NINGÚN paso ejecutado ─────────────
#
# No es del código: los trabajos ni siquiera consiguieron un runner. Mira
# Settings → Billing. Con el repositorio en privado hay cuota mensual gratuita
# y macOS gasta 10 minutos por cada minuto real; al agotarla, GitHub cancela
# todas las ejecuciones de golpe. En un repositorio **público** los runners
# estándar son gratis e ilimitados, así que basta con hacerlo público —o
# ampliar el límite de gasto— para que vuelva a funcionar.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.gitignore']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.gitignore']
  workflow_dispatch:
    inputs:
      construir_ios:
        description: 'Compilar también iOS (runner macOS: cuesta 10x en repos privados)'
        type: boolean
        default: false
      omitir_verificacion:
        description: 'Compilar aunque falle el análisis (para sacar un APK con el CI averiado)'
        type: boolean
        default: false

# Al empujar dos veces seguidas, la primera ejecución deja de ser interesante:
# se cancela en lugar de pagar dos compilaciones completas.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.1'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Android — analiza, prueba y compila. Todo en un runner.
  # ───────────────────────────────────────────────────────────────────────────
  android:
    name: Android (análisis, pruebas y APK)
    runs-on: ubuntu-latest
    # Cubre el tiempo EN COLA además del de ejecución. Un trabajo esperando
    # runner no consume nada, pero deja la ejecución en marcha sin avisar: más
    # vale fallar pronto y volver a lanzarla que descubrirlo media hora después.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        working-directory: mobile
        run: flutter pub get

      # `continue-on-error` sólo se activa si alguien marca la casilla en el
      # disparador manual. Por defecto el análisis sigue siendo bloqueante.
      - name: flutter analyze
        working-directory: mobile
        continue-on-error: ${{ inputs.omitir_verificacion == true }}
        run: flutter analyze

      - name: Pruebas de la app
        working-directory: mobile
        continue-on-error: ${{ inputs.omitir_verificacion == true }}
        run: flutter test

      - name: Compilar APK
        working-directory: mobile
        # El número de compilación sale del contador del workflow para que dos
        # APK nunca compartan versionCode.
        #
        # Se firma con la clave de depuración (así lo deja el proyecto Flutter
        # por defecto): el APK instala y funciona, pero NO sirve para publicar
        # en Play Store. Para eso hace falta un keystore propio en los secretos
        # del repositorio.
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --split-per-abi
          flutter build apk --release \
            --build-number=${{ github.run_number }}

      - name: Compilar App Bundle
        working-directory: mobile
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publicar App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: mobile/build/app/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # iOS — .ipa SIN FIRMAR. **Sólo a petición**, nunca en un push.
  #
  # El runner de macOS se factura a 10x. En un repositorio privado, dos o tres
  # compilaciones de iOS al día agotan la cuota mensual gratuita, y cuando eso
  # ocurre GitHub cancela TODOS los trabajos nada más empezar —sin ejecutar un
  # solo paso—, así que te quedas también sin APK. Ese es exactamente el aspecto
  # que tuvo la ejecución #12.
  #
  # Y el .ipa resultante rinde poco: sin cuenta de Apple de pago sólo se instala
  # con Sideloadly, caduca a los 7 días y compite con el tope de 3 apps. No
  # justifica pagarlo en cada push: se pide con la casilla cuando hace falta.
  # ───────────────────────────────────────────────────────────────────────────
  ios:
    name: IPA iOS (sin firmar)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.construir_ios }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        working-directory: mobile
        run: flutter pub get

      - name: Compilar sin firmar
        working-directory: mobile
        # `--no-codesign` es obligatorio aquí: firmar exige un certificado de
        # desarrollador de Apple (cuenta de pago) que no está en los secretos.
        run: |
          flutter build ios --release --no-codesign \
            --build-number=${{ github.run_number }}

      - name: Empaquetar el .ipa
        working-directory: mobile
        # Un .ipa no es más que un zip con la app dentro de una carpeta
        # `Payload/`. `flutter build ipa` no sirve sin firma, así que se
        # empaqueta a mano. El resultado NO se instala directamente en un
        # iPhone: hay que firmarlo antes (Xcode, Sideloadly, AltStore) o
        # subirlo a un servicio de firma.
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr InventarioPOS-sin-firmar.ipa Payload
          rm -rf Payload
          ls -lh InventarioPOS-sin-firmar.ipa

      - name: Publicar IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-sin-firmar
          path: mobile/InventarioPOS-sin-firmar.ipa
          retention-days: 30
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Backend — pruebas de Node. Independiente: que fallen no puede costar un APK,
  # son entregables distintos.
  # ───────────────────────────────────────────────────────────────────────────
  backend:
    name: Pruebas del backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Dependencias
        working-directory: backend
        run: npm ci

      - name: Pruebas
        working-directory: backend
        # `db:check` y `smoke` quedan fuera a propósito: necesitan credenciales
        # de MariaDB, que no viven en el repositorio. Estas dos no tocan la base.
        run: |
          npm run lint:tx
          npm test
