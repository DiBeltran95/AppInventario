name: Build

# Compila la app para Android e iOS y publica los binarios como artefactos.
#
# Se ejecuta a mano (`workflow_dispatch`) y en cada push a main. El trabajo de
# iOS necesita un runner macOS, que consume minutos de GitHub a razón de 10x;
# por eso puede desactivarse desde el propio disparador manual.

on:
  push:
    branches: [main]
    # Un cambio de documentación no puede costar un runner de macOS a 10x.
    paths-ignore: ['**.md', 'docs/**', '.gitignore']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.gitignore']
  workflow_dispatch:
    inputs:
      construir_ios:
        description: 'Compilar también iOS (runner macOS, consume 10x minutos)'
        type: boolean
        default: true

env:
  FLUTTER_VERSION: '3.44.1'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Puerta de calidad. Corre primero y en Linux, que es rápido y barato: si el
  # análisis falla, no tiene sentido gastar un runner de macOS.
  # ───────────────────────────────────────────────────────────────────────────
  verificar:
    name: Análisis y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        working-directory: mobile
        run: flutter pub get

      - name: flutter analyze
        working-directory: mobile
        run: flutter analyze

      - name: Pruebas de la app
        working-directory: mobile
        run: flutter test

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Dependencias del backend
        working-directory: backend
        run: npm ci

      - name: Pruebas del backend
        working-directory: backend
        # `db:check` queda fuera a propósito: necesita credenciales de MariaDB,
        # que no viven en el repo. Estas dos no tocan la base.
        run: |
          npm run lint:tx
          npm test

  # ───────────────────────────────────────────────────────────────────────────
  # Android — APK release y App Bundle
  # ───────────────────────────────────────────────────────────────────────────
  android:
    name: APK Android
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        working-directory: mobile
        run: flutter pub get

      - name: Compilar APK
        working-directory: mobile
        # El número de compilación sale del contador del workflow para que dos
        # APK nunca compartan versionCode.
        #
        # Se firma con la clave de depuración (así lo deja el proyecto Flutter
        # por defecto): el APK instala y funciona, pero NO sirve para publicar
        # en Play Store. Para eso hace falta un keystore propio en los secretos
        # del repositorio.
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --split-per-abi
          flutter build apk --release \
            --build-number=${{ github.run_number }}

      - name: Compilar App Bundle
        working-directory: mobile
        run: flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publicar App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: mobile/build/app/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # iOS — .ipa SIN FIRMAR
  # ───────────────────────────────────────────────────────────────────────────
  ios:
    name: IPA iOS (sin firmar)
    needs: verificar
    if: github.event_name != 'workflow_dispatch' || inputs.construir_ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        working-directory: mobile
        run: flutter pub get

      - name: Compilar sin firmar
        working-directory: mobile
        # `--no-codesign` es obligatorio aquí: firmar exige un certificado de
        # desarrollador de Apple (cuenta de pago) que no está en los secretos.
        run: |
          flutter build ios --release --no-codesign \
            --build-number=${{ github.run_number }}

      - name: Empaquetar el .ipa
        working-directory: mobile
        # Un .ipa no es más que un zip con la app dentro de una carpeta
        # `Payload/`. `flutter build ipa` no sirve sin firma, así que se
        # empaqueta a mano. El resultado NO se instala directamente en un
        # iPhone: hay que firmarlo antes (Xcode, Sideloadly, AltStore) o
        # subirlo a un servicio de firma.
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr InventarioPOS-sin-firmar.ipa Payload
          rm -rf Payload
          ls -lh InventarioPOS-sin-firmar.ipa

      - name: Publicar IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-sin-firmar
          path: mobile/InventarioPOS-sin-firmar.ipa
          retention-days: 30
          if-no-files-found: error
